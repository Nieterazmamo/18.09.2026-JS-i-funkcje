<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dane</title>
</head>
<body>

    <label>Imie</label>
    <input type="text" id="imie">

    <label>Wiek</label>
    <input type="number" id="wiek">

    <button onclick="pokazDane()">Wyświetl dane</button>

    <script>

        function pokazDane() {

            let imie = document.getElementById("imie").value;
            let wiek = document.getElementById("wiek").value;


            alert("Twoje imię to " + imie + " i masz " + wiek + " lat");
            
        }

    </script>

</body>
</html>
